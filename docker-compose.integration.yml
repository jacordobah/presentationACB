# Runs the web container against the real backends. The adminACB and geolocaACB containers join
# the external acb-net network with the aliases admin-api and geoloca-api.
services:
  web:
    environment:
      ADMIN_API_URL: ${ADMIN_API_URL:-http://admin-api:8080}
      GEO_API_URL: ${GEO_API_URL:-http://geoloca-api:8000}
    networks:
      - default
      - acb-net

networks:
  acb-net:
    external: true
