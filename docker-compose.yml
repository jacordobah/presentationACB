services:
  web:
    build:
      context: .
      args:
        VITE_LOCATION_SIMULATOR: ${VITE_LOCATION_SIMULATOR:-true}
        VITE_POSITION_INTERVAL_MS: ${VITE_POSITION_INTERVAL_MS:-5000}
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-5000}
        VITE_GPS_TRACKING_ENABLED: ${VITE_GPS_TRACKING_ENABLED:-false}
        VITE_GPS_POLICY_ID: ${VITE_GPS_POLICY_ID:-}
        VITE_TRACKING_INTERVAL_MS: ${VITE_TRACKING_INTERVAL_MS:-5000}
        VITE_ESTIMATED_SPEED_KMH: ${VITE_ESTIMATED_SPEED_KMH:-10}
        VITE_ADMIN_APP_URL: ${VITE_ADMIN_APP_URL:-}
    # Reverse Proxy: sin puertos publicados; se entra por acb_reverse_proxy (8088)
    environment:
      ADMIN_API_URL: ${ADMIN_API_URL:-http://api-gateway:5062}
      GEO_API_URL: ${GEO_API_URL:-http://api-gateway:5062}
    networks:
      default: {}
      acb-net:
        aliases: [acb-mobile-fe]
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
    restart: unless-stopped

networks:
  acb-net:
    external: true
    name: acb-net
