services:
  web:
    build:
      context: .
      args:
        VITE_LOCATION_SIMULATOR: ${VITE_LOCATION_SIMULATOR:-true}
        VITE_POSITION_INTERVAL_MS: ${VITE_POSITION_INTERVAL_MS:-5000}
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-5000}
        VITE_GPS_TRACKING_ENABLED: ${VITE_GPS_TRACKING_ENABLED:-false}
        VITE_GPS_POLICY_ID: ${VITE_GPS_POLICY_ID:-}
        VITE_TRACKING_INTERVAL_MS: ${VITE_TRACKING_INTERVAL_MS:-5000}
        VITE_ESTIMATED_SPEED_KMH: ${VITE_ESTIMATED_SPEED_KMH:-10}
        VITE_ADMIN_APP_URL: ${VITE_ADMIN_APP_URL:-}
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      ADMIN_API_URL: https://api-gateway:5062
      GEO_API_URL: https://api-gateway:5062
    volumes:
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/web.crt
        target: /etc/nginx/certs/web.crt
        read_only: true
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/web.key
        target: /etc/nginx/certs/web.key
        read_only: true
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/ca.crt
        target: /etc/nginx/certs/ca.crt
        read_only: true
    networks:
      - default
      - acb-net
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url https://web:443 --origin-ca-pool /run/acb-tls/ca.crt
    volumes:
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/ca.crt
        target: /run/acb-tls/ca.crt
        read_only: true
    depends_on:
      - web
    restart: unless-stopped

networks:
  acb-net:
    external: true
    name: acb-net
