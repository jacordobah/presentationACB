services:
  web:
    build:
      context: .
      args:
        VITE_LOCATION_SIMULATOR: ${VITE_LOCATION_SIMULATOR:-true}
        VITE_POSITION_INTERVAL_MS: ${VITE_POSITION_INTERVAL_MS:-5000}
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-5000}
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8088}:80"
    environment:
      ADMIN_API_URL: ${ADMIN_API_URL:-http://mock-api:4001}
      GEO_API_URL: ${GEO_API_URL:-http://mock-api:4002}
    restart: unless-stopped

  mock-api:
    build: ./mock-api
    environment:
      ACB_JWT_SECRET: ${ACB_JWT_SECRET:-acb-dev-secret-change-me-0123456789abcdef}
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
    restart: unless-stopped
