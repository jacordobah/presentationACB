services:
  web:
    build:
      context: .
      args:
        VITE_LOCATION_SIMULATOR: ${VITE_LOCATION_SIMULATOR:-true}
        VITE_POSITION_INTERVAL_MS: ${VITE_POSITION_INTERVAL_MS:-5000}
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-5000}
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8088}:80"
    environment:
      ADMIN_API_URL: ${ADMIN_API_URL:-http://admin-api:8080}
      GEO_API_URL: ${GEO_API_URL:-http://geoloca-api:8000}
    networks:
      - default
      - acb-net
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
    restart: unless-stopped

networks:
  acb-net:
    external: true
    name: acb-net
